services:
  # ------------------------------
  # 1. REVERSE PROXY
  # ------------------------------
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - public
      - internal

  # ------------------------------
  # 2. BASE DE DATOS (NO EXPUESTA)
  # ------------------------------
  postgres:
    image: postgres:17
    restart: always
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APOLO_DB_NAME: ${APOLO_DB_NAME}
      APOLO_DB_USER: ${APOLO_DB_USER}
      APOLO_DB_PASS: ${APOLO_DB_PASS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-backups:/backups
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - internal

  # ------------------------------ 
  # 3. BACKEND (NODE)
  # ------------------------------
  backend:
    build: ./backend
    restart: always
    container_name: backend
    environment:
      PORT: 5020
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      WEB_CORS: ${WEB_CORS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-true}
      REFRESH_TOKEN_COOKIE_SAMESITE: ${REFRESH_TOKEN_COOKIE_SAMESITE:-lax}
      API_CONTIFICO: ${API_CONTIFICO}
      API_KEY: ${API_KEY}
      API_TOKEN: ${API_TOKEN}
      GHL_LOCATION_ID: ${GHL_LOCATION_ID}
      GHL_TOKEN: ${GHL_TOKEN}
      GHL_PIPELINE_ID: ${GHL_PIPELINE_ID}
      GHL_BASE_URL: ${GHL_BASE_URL}
      GHL_WEBHOOK_SECRET: ${GHL_WEBHOOK_SECRET}
      META_API_VERSION: ${META_API_VERSION}
      META_DATASET_ID: ${META_DATASET_ID}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_PAGE_ID: ${META_PAGE_ID}
      # RVE recibe las salidas enviadas por ABS y consulta usuarios en ABS.
      RVE_SYNC_TOKEN: ${RVE_SYNC_TOKEN:?Configure RVE_SYNC_TOKEN en el archivo .env}
      ABS_SYNC_URL: ${ABS_SYNC_URL:-http://backend_apolo:5030}
      ABS_SYNC_TOKEN: ${ABS_SYNC_TOKEN:?Configure ABS_SYNC_TOKEN en el archivo .env}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - internal          # para comunicarse con DB y otros servicios internos
      - public-internet   # para poder salir a Internet
    depends_on:
      - postgres
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ------------------------------
  # 4. FRONTEND (VITE, SERVIDO POR NGINX)
  # ------------------------------
  frontend:
    build: ./frontend
    restart: always
    container_name: frontend
    networks:
      - internal
    depends_on:
      - backend

  # ------------------------------
  # 5. BACKEND APOLO (NODE)
  # ------------------------------
  backend_apolo:
    build: ./backend_apolo
    restart: always
    container_name: backend_apolo
    environment:
      PORT: ${APOLO_PORT}
      DB_NAME: ${APOLO_DB_NAME}
      DB_USER: ${APOLO_DB_USER}
      DB_PASS: ${APOLO_DB_PASS}
      DB_HOST: ${APOLO_DB_HOST}
      DB_PORT: ${APOLO_DB_PORT}
      WEB_CORS: ${APOLO_WEB_CORS}
      JWT_SECRET: ${APOLO_JWT_SECRET}
      # ABS envía salidas a RVE y expone la consulta interna de usuarios.
      RVE_SYNC_URL: ${RVE_SYNC_URL:-http://backend:5020}
      RVE_SYNC_TOKEN: ${RVE_SYNC_TOKEN:?Configure RVE_SYNC_TOKEN en el archivo .env}
      ABS_SYNC_TOKEN: ${ABS_SYNC_TOKEN:?Configure ABS_SYNC_TOKEN en el archivo .env}
    networks:
      - internal
      - public-internet
    depends_on:
      - postgres
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ------------------------------
  # 6. FRONTEND APOLO (VITE, SERVIDO POR NGINX)
  # ------------------------------
  frontend_apolo:
    build:
      context: ./frontend_apolo
      args:
        VITE_API_URL: ${APOLO_VITE_API_URL}
    restart: always
    container_name: frontend_apolo
    networks:
      - internal
    depends_on:
      - backend_apolo

  landingpage:
    build: ./landingpage
    container_name: landingpage
    restart: always
    networks:
      - internal

# ------------------------------
# VOLUMES
# ------------------------------
volumes:
  npm-data:
  npm-letsencrypt:
  postgres-data:

# ------------------------------
# NETWORKS
# ------------------------------
networks:
  public:
  internal:
    internal: true      # base de datos y servicios internos siguen aislados
  public-internet:
    driver: bridge       # backend puede salir a Internet
